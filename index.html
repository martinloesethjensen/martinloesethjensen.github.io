        <style>#myImg{cursor:pointer;transition:0.3s;} #myImg:hover{opacity:0.8;} .modal{display:none;position:fixed;z-index:2;padding-top:100px;left:0;top:0;width:100%;height:100%;overflow:auto;background-color:rgb(0,0,0);background-color:rgba(0,0,0,0.9);} .modal-content{margin:auto;display:block;width:80%;max-width:700px;border-radius:5px;} #caption{margin:auto;display:block;width:80%;max-width:700px;text-align:center;color:#ccc;padding:10px 0;height:150px;} .modal-content, #caption{-webkit-animation-name:zoom;-webkit-animation-duration:0.6s;animation-name:zoom;animation-duration:0.6s;} @-webkit-keyframes zoom{from{-webkit-transform:scale(0)} to{-webkit-transform:scale(1)} } @keyframes zoom{from{transform:scale(0)} to{transform:scale(1)} } .close{position:absolute;top:15px;right:35px;color:#f1f1f1;font-size:40px;font-weight:bold;transition:0.3s;} .close:hover, .close:focus{color:#bbb;text-decoration:none;cursor:pointer;} @media only screen and (max-width:700px){.modal-content{width:100%;} }</style>
	</head>

		<!-- The Modal -->
		<div id="myModal" class="modal">

			<!-- The Close Button -->
			<span class="close">&times;</span>

			<!-- Modal Content (The Image) -->
			<img class="modal-content" id="img01">


			<!-- Modal Caption (Image Text) -->
			<div id="caption"></div>
		</div>

		<!-- Scripts -->
		<script type="text/javascript" src="https://platform.linkedin.com/badges/js/profile.js" async defer></script>
			<script>
                if ('addEventListener' in window) {
                    window.addEventListener('load', function() { document.body.className = document.body.className.replace(/\bis-preload\b/, ''); });
                    document.body.className += (navigator.userAgent.match(/(MSIE|rv:11\.0)/) ? ' is-ie' : '');
                }

                // Get the modal
                let modal = document.getElementById('myModal');

                // Get the image and insert it inside the modal - use its "alt" text as a caption
                let img = document.getElementById('myImg');
                let modalImg = document.getElementById("img01");
                let captionText = document.getElementById("caption");
                img.onclick = function(){
                    modal.style.display = "block";
                    modalImg.src = "images/myImg.jpg";
					captionText.innerHTML = "Just if you wanted to have a closer look";
                };

                // Get the <span> element that closes the modal
                let span = document.getElementsByClassName("close")[0];

                // When the user clicks on <span> (x), close the modal
                span.onclick = function() {
                    modal.style.display = "none";
                }
			</script>
